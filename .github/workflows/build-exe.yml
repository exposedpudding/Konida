name: Build Windows exe
on:
  push:
    branches: [claude/konica-minolta-ywjuup]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name Konida --collect-all playwright app.py
      - run: copy fleet.example.yaml dist\fleet.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: Konida-windows
          path: dist/
